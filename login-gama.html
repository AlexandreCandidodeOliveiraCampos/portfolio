<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Entrar — GAMA</title>
<meta name="description" content="Acesso restrito ao projeto GAMA." />
<style>
  :root {
    --bg: #eef1ea;
    --surface: #ffffff;
    --ink: #16241d;
    --muted: #56675c;
    --line: #dce1d6;
    --green: #2f5d49;
    --green-soft: #e4ede7;
    --ochre: #b0791f;
    --ring: #2f5d49;
    --danger: #b3261e;
    --danger-soft: #fbeae8;
    --shadow: 0 1px 2px rgba(22,36,29,.06), 0 8px 24px -12px rgba(22,36,29,.18);
    --serif: Georgia, "Iowan Old Style", "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1512; --surface: #17211c; --ink: #e8ede6; --muted: #9caea2;
      --line: #263029; --green: #79b89a; --green-soft: #1c2a23; --ochre: #d7a64c;
      --ring: #79b89a; --danger: #f2a89f; --danger-soft: #2a1614;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    line-height: 1.6;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }

  .eyebrow {
    font-size: .72rem;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: .55rem;
  }
  .eyebrow::before {
    content: "";
    width: 1.6rem; height: 1px;
    background: var(--ochre);
    display: inline-block;
  }

  .panel {
    width: 100%;
    max-width: 400px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: clamp(1.6rem, 5vw, 2.4rem);
    box-shadow: var(--shadow);
  }
  h1 {
    font-family: var(--serif);
    font-weight: 600;
    font-size: 1.75rem;
    letter-spacing: -.01em;
    margin: .9rem 0 .2rem;
  }
  .sub { color: var(--muted); font-size: .95rem; margin: 0 0 1.6rem; }

  label {
    display: block;
    font-size: .8rem;
    font-weight: 600;
    color: var(--ink);
    margin: 0 0 .35rem;
  }
  .field { margin-bottom: 1.1rem; }
  input {
    width: 100%;
    font-size: .95rem;
    font-family: inherit;
    color: var(--ink);
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: .7rem .85rem;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus {
    outline: none;
    border-color: var(--ring);
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 22%, transparent);
  }

  button {
    width: 100%;
    font-family: inherit;
    font-size: .98rem;
    font-weight: 700;
    color: #fff;
    background: var(--green);
    border: none;
    border-radius: 10px;
    padding: .8rem 1rem;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: .5rem;
    transition: filter .15s ease, opacity .15s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .7; cursor: progress; }
  @media (prefers-color-scheme: dark) { button { color: #0e1512; } }

  .spinner {
    width: 15px; height: 15px;
    border: 2px solid rgba(255,255,255,.5);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin .7s linear infinite;
  }
  @media (prefers-color-scheme: dark) {
    .spinner { border-color: rgba(14,21,18,.4); border-top-color: #0e1512; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .alert {
    display: none;
    align-items: flex-start;
    gap: .55rem;
    background: var(--danger-soft);
    color: var(--danger);
    border: 1px solid color-mix(in srgb, var(--danger) 35%, transparent);
    border-radius: 10px;
    padding: .7rem .85rem;
    font-size: .88rem;
    margin-bottom: 1.1rem;
  }
  .alert.show { display: flex; }
  .alert svg { flex: none; margin-top: 1px; }

  .back {
    margin-top: 1.4rem;
    text-align: center;
    font-size: .85rem;
  }
  .back a { color: var(--green); text-decoration: none; }
  .back a:hover { text-decoration: underline; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
  <div class="panel">
    <span class="eyebrow">GAMA</span>
    <h1>Entrar</h1>
    <p class="sub">Área de acesso restrito.</p>

    <div class="alert" id="alert" role="alert" aria-live="assertive">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="alertMsg">Usuário não cadastrado.</span>
    </div>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="username" placeholder="seu@email.com" required />
      </div>
      <div class="field">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" autocomplete="current-password" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submitBtn">Entrar</button>
    </form>

    <p class="back"><a href="index.html">&larr; Voltar ao portfólio</a></p>
  </div>

  <script>
    // Autenticação ainda não implementada: o fluxo simula o envio, mas sempre
    // responde "Usuário não cadastrado". As credenciais NÃO são enviadas nem
    // armazenadas em lugar algum — tudo acontece apenas nesta página.
    (function () {
      var form = document.getElementById("loginForm");
      var btn = document.getElementById("submitBtn");
      var alertBox = document.getElementById("alert");
      var alertMsg = document.getElementById("alertMsg");

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        alertBox.classList.remove("show");

        var email = document.getElementById("email").value.trim();
        var senha = document.getElementById("senha").value;
        if (!email || !senha) {
          alertMsg.textContent = "Preencha e-mail e senha.";
          alertBox.classList.add("show");
          return;
        }

        // Simula a verificação no servidor.
        btn.disabled = true;
        btn.innerHTML = '<span class="spinner"></span> Entrando…';

        setTimeout(function () {
          btn.disabled = false;
          btn.textContent = "Entrar";
          alertMsg.textContent = "Usuário não cadastrado.";
          alertBox.classList.add("show");
        }, 800);
      });
    })();
  </script>
</body>
</html>
